[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "flybrain-kristal"
version = "0.1.0"
description = "Screenshot-driven Kristal dodging with a real connectome reservoir and PPO motor learning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "Pillow>=10,<13", "torch>=2.2,<3", "pygame-ce>=2.5,<3"]
[project.optional-dependencies]
connectome = ["pyarrow>=15,<27", "pandas>=2,<4"]
test = ["pytest>=8,<10", "lupa>=2.2,<3"]
[project.scripts]
flybrain = "flybrain.cli:main"
[tool.setuptools.packages.find]
include = ["flybrain*"]
[tool.setuptools.package-data]
flybrain = ["data/*.npz", "data/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
